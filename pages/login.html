<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceder a Skillup</title>
  <link rel="stylesheet" href="../styles/header-footer.css">
  <link rel="stylesheet" href="../styles/estilo-login.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div id="header"></div>

  <main class="login-page">
    <div class="login-card">
      <div class="logo-login">
        <img src="../img/logo skillup.png" alt="SkillUp">
      </div>

      <div class="card-content">
        <h1>¡Bienvenido de vuelta!</h1>
        <p class="subtitle">Ingresá tus datos para acceder a tus cursos</p>

        <form action="#" method="get" class="login-form">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="correo@gmail.com" required>

          <label for="password">Contraseña</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Contraseña" required>
          </div>

          <div class="form-options">
            <label>
              <input type="checkbox" name="remember"> Recuérdame
            </label>
            <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" class="btn-primary">Iniciar sesión</button>

          <a href="#" class="btn-google">
            <img src="../img/google.png" alt="Google icon">
            Ingresar con Google
          </a>
        </form>

        <p class="signup-prompt">
          ¿No tienes una cuenta? <a href="registro.html">Registrate aquí</a>
        </p>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script type="module" src="../js/renderizar-layout.js"></script>
  <script type="module" src="../js/login.js"></script>

</body>
</html>
