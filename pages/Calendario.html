<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Calendario</title>
  <link rel="stylesheet" href="../styles/EstiloCalendario.css">
  <link rel="stylesheet" href="../styles/header-footer.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <div id="header"></div>

  <main>
    <div class="calendar">
      <div class="titulo"> Calendario de Cursos 📅 </div>

      <div class="calendar-header">
        <button id="prevMonth" aria-label="Mes anterior">&lt;</button>
        <h1 id="currentMonthDisplay">Octubre 2025</h1>
        <button id="nextMonth" aria-label="Mes siguiente">&gt;</button>
      </div>

      <p class="descripcion">Haga click sobre el curso deseado para obtener más detalles</p>

      <div class="calendar-wrapper">
        <div class="calendar-grid" id="calendarGrid">
          <div class="day-name">D</div>
          <div class="day-name">L</div>
          <div class="day-name">M</div>
          <div class="day-name">X</div>
          <div class="day-name">J</div>
          <div class="day-name">V</div>
          <div class="day-name">S</div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script type="module" src="../js/renderizar-layout.js"></script>
  <script type="module" src="../js/Calendario.js"></script>
  <script type="module" src="../js/init-carrito.js"></script>
</body>
</html>
