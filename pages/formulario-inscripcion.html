<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de inscripción</title>
  <link rel="stylesheet" href="../styles/formulario-inscripcion.css">
  <link rel="stylesheet" href="../styles/header-footer.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div id="header"></div>

  <main class="main">
    <div class="titulo__contenedor"> 
      <h1 class="titulo">FORMULARIO DE INSCRIPCIÓN</h1>
    </div>

    <form class="form" method="get">

      <div class="row encabezados">
        <span>DNI</span>
        <span>Nombre</span>
        <span>Apellido</span>
      </div>

      <div class="row">
        <input type="number" name="dni1" required>
        <input type="text" name="nombre1" required>
        <input type="text" name="apellido1" required>
        <button type="button" class="dlt-btn">-</button>
      </div>

      <div class="row">
        <input type="number" name="dni2" required>
        <input type="text" name="nombre2" required>
        <input type="text" name="apellido2" required>
        <button type="button" class="dlt-btn">-</button>
      </div>

      <div class="row">
        <input type="number" name="dni3" required>
        <input type="text" name="nombre3" required>
        <input type="text" name="apellido3" required>
        <button type="button" class="dlt-btn">-</button>
      </div>

      <div class="agregar__persona">
        <button type="submit" class="boton">+</button>
        <h3 class="agregar">AGREGAR PERSONA</h3>
      </div>

      <div class="boton__de__inscripcion">
        <span class="span__000">$000.-</span> 
        <button type="submit" class="inscribirse">INSCRIBIRSE</button> 
      </div>
    </form>
  </main>

  <div id="footer"></div>

  <script type="module" src="../js/renderizar-layout.js"></script>
  <script type="module" src="../js/init-carrito.js"></script>
</body>
</html>
